# ─────────────────────────────────────────────────────────────────────────────
#  Cacha el Precio · entorno local
# ─────────────────────────────────────────────────────────────────────────────
#
#  Levanta las dos piezas de infraestructura que los microservicios necesitan
#  para correr en tu computador: la base de datos y la cola de mensajes.
#
#      docker compose up -d        levantar
#      docker compose ps           ver si están sanos
#      docker compose logs -f      mirar qué están haciendo
#      docker compose down         apagar (los datos se conservan)
#      docker compose down -v      apagar Y BORRAR los datos
#
#  ⚠️ Este mismo archivo es el que va a correr en la EC2 en producción
#  (ADR-008). Por eso no hay nada acá que solo sirva para desarrollo: los
#  puertos, las credenciales y las imágenes salen todos del .env, así que
#  cambiar de entorno es cambiar ese archivo, no este.
#
#  Antes de la primera vez:   cp .env.example .env   y rellena las contraseñas.
# ─────────────────────────────────────────────────────────────────────────────

name: cachaelprecio

services:
  # ───────────────────────────────────────────────────────────────────────────
  #  Caddy - 
  # ───────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Puerto interno, sin dominio ni TLS: es por donde API Gateway le habla
      # directo a product-service (ver caddy/Caddyfile, bloque ":8080").
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - cep
  # ───────────────────────────────────────────────────────────────────────────
  #  PostgreSQL — la base de datos
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cep-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-cachaelprecio}
      POSTGRES_USER: ${DB_USER:-cachaelprecio}
      # Sin valor por defecto A PROPÓSITO: si el .env no tiene contraseña,
      # queremos que falle acá y no que arranque con una contraseña adivinable.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}

    ports:
      # Solo escucha en 127.0.0.1, no en toda la red. Así tu Postgres de pruebas
      # no queda expuesto si estás conectado al wifi de la universidad.
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      # Acá viven los datos de verdad. Sobrevive a `down`, muere con `down -v`.
      - postgres-datos:/var/lib/postgresql/data
      # Todo lo que esté en esta carpeta se ejecuta solo, en orden alfabético,
      # la primera vez que el volumen se crea vacío.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # `docker compose ps` dice "healthy" recién cuando Postgres acepta
      # conexiones de verdad, no cuando el contenedor arrancó. Es la diferencia
      # entre "está prendido" y "está listo para trabajar".
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cachaelprecio} -d ${DB_NAME:-cachaelprecio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  RabbitMQ — la cola de mensajes
  # ───────────────────────────────────────────────────────────────────────────
  #  Desacopla la ingesta del procesamiento: si el normalizador está caído, las
  #  ofertas esperan en la cola en vez de perderse (ARQUITECTURA.md §6).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cep-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cachaelprecio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en el .env}

    ports:
      # 5672  → por acá hablan los microservicios (protocolo AMQP)
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      # 15672 → el panel web. Se abre en http://localhost:15672
      #         Es la pantalla que hay que mostrar en la demo del EP2 para
      #         evidenciar las colas y la DLQ.
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"

    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Gateway (BFF) — la puerta de entrada, y donde se valida el token
  # ───────────────────────────────────────────────────────────────────────────
  #  Es a quien Caddy le reenvía todo. Valida el JWT contra el JWKS de Cognito
  #  y recién entonces consulta a product-service.
  #
  #  NO publica puertos al host a propósito: solo Caddy debería poder hablarle.
  #  Si se expusiera, existiría una puerta que esquiva a Caddy y al API Gateway.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cep-gateway
    restart: unless-stopped

    environment:
      GATEWAY_PORT: 8080
      # Dentro del compose el host es el NOMBRE DEL SERVICIO. Cada contenedor
      # tiene su propio localhost, y ahí no hay nadie escuchando.
      PRODUCT_URL: http://product-service:8081
      # Los tres valores de Cognito salen de cognito.env, que no se versiona.
      # Sin ellos el servicio arranca pero rechaza todos los tokens.
      # Van entre comillas: el mensaje de ${VAR:?...} lleva dos puntos y sin
      # comillas YAML lo lee como el inicio de otra clave.
      COGNITO_ISSUER: "${COGNITO_ISSUER:?falta COGNITO_ISSUER, pega cognito.env en el .env}"
      COGNITO_JWKS_URI: "${COGNITO_JWKS_URI:?falta COGNITO_JWKS_URI}"
      COGNITO_CLIENT_IDS_VALIDOS: "${COGNITO_CLIENT_IDS_VALIDOS:?falta COGNITO_CLIENT_IDS_VALIDOS}"

    depends_on:
      - product-service

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Product Service — catálogo de productos (Micronaut/Java)
  # ───────────────────────────────────────────────────────────────────────────
  #  Es el servicio al que Caddy le enruta el tráfico (api.cacha-el-precio.com).
  #  Usa SQLite (no PostgreSQL) y expone HTTP en 8081 y gRPC en 50051:
  #      GET /productos        listar productos
  #      GET /catalogos        listar catálogos
  #      GET /health           verificar estado
  #      /swagger-ui           documentación
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: cep-product-service
    restart: unless-stopped

    environment:
      PRODUCT_PORT: ${PRODUCT_PORT:-8081}
      PRODUCT_GRPC_PORT: ${PRODUCT_GRPC_PORT:-50051}
      PRODUCT_DB_URL: ${PRODUCT_DOCKER_DB_URL:-jdbc:sqlite:/app/data/product.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL}

    volumes:
      # La base SQLite vive acá; sobrevive a `down`, muere con `down -v`.
      - product-datos:/app/data

    ports:
      - "127.0.0.1:${PRODUCT_PORT:-8081}:8081"
      - "127.0.0.1:${PRODUCT_GRPC_PORT:-50051}:50051"

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Scraper API — el servicio de scraping (Python/FastAPI)
  # ───────────────────────────────────────────────────────────────────────────
  #  Corre sobre Python 3.14 + FastAPI. Scrappea tiendas chilenas,
  #  procesa imágenes a WebP y las sube a S3.
  #      POST /scrape/{tienda}   disparar un barrido
  #      GET  /productos         listar productos
  #      GET  /health            verificar estado
  scraper-api:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    container_name: cep-scraper-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${DB_USER:-cachaelprecio}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-cachaelprecio}?options=-csearch_path%3Dscraper
      APP_ENV: ${APP_ENV:-production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # El scraper publica los productos en el Product Service por su API,
      # no tocando su base. Esta URL es el host interno del compose.
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:8081}

    ports:
      - "127.0.0.1:${SCRAPER_API_PORT:-8000}:8000"

    networks: [cep]

# ─────────────────────────────────────────────────────────────────────────────
#  Volúmenes: donde Docker guarda los datos para que no se pierdan al apagar
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-datos:
  rabbitmq-datos:
  product-datos:
  caddy_data:
  caddy_config:

# ─────────────────────────────────────────────────────────────────────────────
#  Red interna: los contenedores se ven entre ellos por su nombre de servicio.
#  Desde el BFF, la base de datos es el host `postgres`, no `localhost`.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  cep:
    driver: bridge