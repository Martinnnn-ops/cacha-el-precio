# ─────────────────────────────────────────────────────────────────────────────
#  Cacha el Precio · entorno local
# ─────────────────────────────────────────────────────────────────────────────
#
#  Levanta los servicios y la única infraestructura compartida que permanece:
#  PostgreSQL compartido como servidor, con un esquema por microservicio.
#
#      docker compose up -d        levantar
#      docker compose ps           ver si están sanos
#      docker compose logs -f      mirar qué están haciendo
#      docker compose down         apagar (los datos se conservan)
#      docker compose down -v      apagar Y BORRAR los datos
#
#  ⚠️ Este mismo archivo es el que va a correr en la EC2 en producción
#  (ADR-008). Por eso no hay nada acá que solo sirva para desarrollo: los
#  puertos, las credenciales y las imágenes salen todos del .env, así que
#  cambiar de entorno es cambiar ese archivo, no este.
#
#  Antes de la primera vez:   cp .env.example .env   y rellena las contraseñas.
#
#  Imágenes: los 4 servicios propios tienen `build:` Y `image:`.
#    · En tu PC (y con tools/desplegar.sh):  docker compose up -d --build
#      compila aquí y etiqueta la imagen como ...:local. Igual que siempre.
#    · El CD (.github/workflows/cd.yml):  IMAGEN_TAG=<commit> docker compose pull
#      baja de GHCR la imagen que armó y probó GitHub, y la EC2 no compila nada.
# ─────────────────────────────────────────────────────────────────────────────

name: cachaelprecio

services:
  # ───────────────────────────────────────────────────────────────────────────
  #  Caddy - 
  # ───────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # Puerto interno, sin dominio ni TLS: es por donde API Gateway le habla
      # directo a product-service (ver caddy/Caddyfile, bloque ":8080").
      - "8080:8080"
    environment:
      # El secreto que solo conoce el API Gateway. Lo pone tools/desplegar.sh en
      # el .env del servidor, leyendolo de borde.env. Si falta, el Caddyfile
      # responde 403 a todo por su valor por defecto.
      BORDE_SECRETO: "${BORDE_SECRETO:-}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - cep
  # ───────────────────────────────────────────────────────────────────────────
  #  PostgreSQL — la base de datos
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cep-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-cachaelprecio}
      POSTGRES_USER: ${DB_USER:-cachaelprecio}
      # Sin valor por defecto A PROPÓSITO: si el .env no tiene contraseña,
      # queremos que falle acá y no que arranque con una contraseña adivinable.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}

    ports:
      # Solo escucha en 127.0.0.1, no en toda la red. Así tu Postgres de pruebas
      # no queda expuesto si estás conectado al wifi de la universidad.
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      # Acá viven los datos de verdad. Sobrevive a `down`, muere con `down -v`.
      - postgres-datos:/var/lib/postgresql/data
      # Todo lo que esté en esta carpeta se ejecuta solo, en orden alfabético,
      # la primera vez que el volumen se crea vacío.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # `docker compose ps` dice "healthy" recién cuando Postgres acepta
      # conexiones de verdad, no cuando el contenedor arrancó. Es la diferencia
      # entre "está prendido" y "está listo para trabajar".
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cachaelprecio} -d ${DB_NAME:-cachaelprecio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Gateway (BFF) — la puerta de entrada, y donde se valida el token
  # ───────────────────────────────────────────────────────────────────────────
  #  Es a quien Caddy le reenvía todo. Valida el JWT contra el JWKS de Cognito
  #  y recién entonces consulta a product-service.
  #
  #  NO publica puertos al host a propósito: solo Caddy debería poder hablarle.
  #  Si se expusiera, existiría una puerta que esquiva a Caddy y al API Gateway.
  gateway:
    image: ${IMAGEN_REGISTRO:-ghcr.io/martinnnn-ops/cacha-el-precio}/gateway:${IMAGEN_TAG:-local}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cep-gateway
    restart: unless-stopped

    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      # /metrics para Prometheus, en un puerto que no se publica (PLAN-EFT §8).
      METRICAS_PUERTO: 9464
      # Dentro del compose el host es el NOMBRE DEL SERVICIO. Cada contenedor
      # tiene su propio localhost, y ahí no hay nadie escuchando.
      PRODUCT_URL: http://product-service:8081
      # La bandeja de correos del panel (/api/admin/mensajeria/correos).
      NOTIFICATION_URL: http://notification-service:8082
      # «Seguir un barrido» (panel admin): el historial de barridos del scraper.
      SCRAPER_URL: http://scraper-api:8000
      # Los valores de Cognito salen de cognito.env, que no se versiona.
      # Sin ellos el servicio arranca pero rechaza todos los tokens.
      # Van entre comillas: el mensaje de ${VAR:?...} lleva dos puntos y sin
      # comillas YAML lo lee como el inicio de otra clave.
      COGNITO_ISSUER: "${COGNITO_ISSUER:?falta COGNITO_ISSUER, pega cognito.env en el .env}"
      COGNITO_CLIENT_IDS_VALIDOS: "${COGNITO_CLIENT_IDS_VALIDOS:?falta COGNITO_CLIENT_IDS_VALIDOS}"
      COGNITO_WRITE_SCOPE: "${COGNITO_SCRAPER_SCOPE:-https://api.cachaelprecio.cl/ingesta}"
      # Administracion de mensajeria (EP3, T11): /api/admin/mensajeria, solo
      # para el grupo admin. aws = SQS/SNS de verdad; memoria = simulado, para
      # programar sin cuenta de AWS. Credenciales por el rol de la EC2.
      MENSAJERIA_MODO: ${MENSAJERIA_MODO:-aws}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

    depends_on:
      - product-service

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Product Service — catálogo de productos (ASP.NET Core/C#)
  # ───────────────────────────────────────────────────────────────────────────
  #  Solo el gateway y el scraper le hablan por la red interna.
  #  Es dueño del esquema PostgreSQL `product` y expone HTTP en 8081:
  #      GET /api/products     listar productos
  #      GET /health           verificar estado
  product-service:
    image: ${IMAGEN_REGISTRO:-ghcr.io/martinnnn-ops/cacha-el-precio}/product-service:${IMAGEN_TAG:-local}
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: cep-product-service
    restart: unless-stopped

    environment:
      ASPNETCORE_HTTP_PORTS: 8081
      # /metrics para Prometheus, en un puerto que no se publica (PLAN-EFT §8).
      METRICAS_PUERTO: 9464
      ConnectionStrings__PostgreSql: "Host=postgres;Port=5432;Database=${DB_NAME:-cachaelprecio};Username=${DB_USER:-cachaelprecio};Password=${DB_PASSWORD};Search Path=product,public"
      # Mensajería del flujo 2: publica los cambios de oferta en SNS. Credenciales
      # por el rol de la EC2 en producción; en local salen del .env. Si el ARN
      # viene vacío, product-service solo registra el evento y no publica.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SNS_CAMBIOS_OFERTA_ARN: ${SNS_CAMBIOS_OFERTA_ARN:-}
      # Flujo 1: consume las ofertas que el scraper deja en la cola. Si la URL viene
      # vacia, el consumidor no arranca y el POST /api/products sigue igual.
      SQS_OFERTAS_CRUDAS_URL: ${SQS_OFERTAS_CRUDAS_URL:-}
      SQS_OFERTAS_CRUDAS_DLQ_URL: ${SQS_OFERTAS_CRUDAS_DLQ_URL:-}
      # Kinesis cep-precios (ADR-035): lee cada precio capturado y calcula el precio
      # habitual. Sin stream, LectorPrecios no arranca; sin DLQ, los rotos van al log.
      KINESIS_PRECIOS_STREAM: ${KINESIS_PRECIOS_STREAM:-}
      KINESIS_REGION: ${KINESIS_REGION:-us-east-1}
      SQS_PRECIOS_DLQ_URL: ${SQS_PRECIOS_DLQ_URL:-}
      # Lector de auditoría (flujo 2): vacía = no arranca.
      SQS_AUDITORIA_PRECIOS_URL: ${SQS_AUDITORIA_PRECIOS_URL:-}
      SQS_AUDITORIA_PRECIOS_DLQ_URL: ${SQS_AUDITORIA_PRECIOS_DLQ_URL:-}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:${PRODUCT_PORT:-8081}:8081"

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Notification Service — avisos por correo (C#/.NET)
  # ───────────────────────────────────────────────────────────────────────────
  #  Consume la cola SQS cep-notificaciones y le manda un correo a quien sigue la
  #  prenda que cambió. Solo en la red interna; no se expone a internet. Resuelve
  #  los seguidores por HTTP a product-service y el correo por Cognito.
  #  Ver docs/MENSAJERIA.md y docs/adr/030-notification-service.md.
  notification-service:
    image: ${IMAGEN_REGISTRO:-ghcr.io/martinnnn-ops/cacha-el-precio}/notification-service:${IMAGEN_TAG:-local}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: cep-notification-service
    restart: unless-stopped

    environment:
      ASPNETCORE_HTTP_PORTS: 8082
      # /metrics para Prometheus, en un puerto que no se publica (PLAN-EFT §8).
      METRICAS_PUERTO: 9464
      ConnectionStrings__PostgreSql: "Host=postgres;Port=5432;Database=${DB_NAME:-cachaelprecio};Username=${DB_USER:-cachaelprecio};Password=${DB_PASSWORD};Search Path=notification,public"
      # Host interno del compose; resuelve los seguidores por la red privada.
      PRODUCT_URL: http://product-service:8081
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      # Salen de mensajeria.env (lo escribe tools/tf.sh). Si vienen vacías, el
      # consumidor no arranca y el servicio igual sirve /health.
      SQS_NOTIFICACIONES_URL: ${SQS_NOTIFICACIONES_URL:-}
      SQS_NOTIFICACIONES_DLQ_URL: ${SQS_NOTIFICACIONES_DLQ_URL:-}
      # log = escribe el correo en el log; smtp = Gmail real (exige SMTP_*).
      CORREO_MODO: ${CORREO_MODO:-log}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SITIO_URL: ${SITIO_URL:-https://www.cacha-el-precio.com}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8082}:8082"

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Scraper API — el servicio de scraping (Python/FastAPI)
  # ───────────────────────────────────────────────────────────────────────────
  #  Corre sobre Python 3.14 + FastAPI. Scrappea tiendas chilenas,
  #  procesa imágenes a WebP y las sube a S3.
  #      POST /scrape/{tienda}   disparar un barrido
  #      GET  /productos         listar productos
  #      GET  /health            verificar estado
  scraper-api:
    image: ${IMAGEN_REGISTRO:-ghcr.io/martinnnn-ops/cacha-el-precio}/scraper:${IMAGEN_TAG:-local}
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    container_name: cep-scraper-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${DB_USER:-cachaelprecio}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-cachaelprecio}?options=-csearch_path%3Dscraper
      APP_ENV: ${APP_ENV:-production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # El scraper publica los productos en el Product Service por su API,
      # no tocando su base. Esta URL es el host interno del compose.
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:8081}
      # Flujo 1 del EP3: con MODO_PUBLICACION=cola cada prenda va a POST /ingesta
      # (API Gateway -> SQS cep-ofertas-crudas) con el token del client del
      # scraper, en vez de ir directo a Product Service. http = lo de siempre.
      MODO_PUBLICACION: ${MODO_PUBLICACION:-http}
      API_GATEWAY_URL_INGESTA: ${API_GATEWAY_URL_INGESTA:-}
      COGNITO_DOMINIO: ${COGNITO_DOMINIO:-}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_SCRAPER_CLIENT_ID: ${COGNITO_SCRAPER_CLIENT_ID:-}
      COGNITO_SCRAPER_CLIENT_SECRET: ${COGNITO_SCRAPER_CLIENT_SECRET:-}
      COGNITO_SCRAPER_SCOPE: ${COGNITO_SCRAPER_SCOPE:-}
      # Kinesis cep-precios (ADR-035): cada prenda aceptada manda su precio al
      # stream, de mejor esfuerzo. Vacio = no manda nada y el barrido sigue igual.
      KINESIS_PRECIOS_STREAM: ${KINESIS_PRECIOS_STREAM:-}
      KINESIS_REGION: ${KINESIS_REGION:-us-east-1}

    ports:
      - "127.0.0.1:${SCRAPER_API_PORT:-8000}:8000"

    networks: [cep]

  # ───────────────────────────────────────────────────────────────────────────
  #  Monitoreo (PLAN-EFT §8 · infra/monitoreo/README.md) — perfil `monitoreo`
  # ───────────────────────────────────────────────────────────────────────────
  #  NO se prende con el `up -d` normal ni con el CD: solo con
  #      docker compose --profile monitoreo up -d
  #  Nada de esto publica puertos hacia afuera: Grafana escucha en 127.0.0.1 y
  #  se entra por túnel SSH (ssh -L 3000:localhost:3000 ...). Topes de RAM
  #  medidos el 28-11 con docker stats y los servicios arriba: ~670 MB los 5 juntos
  #  (Grafana ~375, Loki ~100, Prometheus ~100, Alloy ~90, node-exporter ~15).
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: cep-prometheus
    profiles: [monitoreo]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-datos:/prometheus
    mem_limit: 256m
    networks: [cep]

  node-exporter:
    image: prom/node-exporter:v1.13.1
    container_name: cep-node-exporter
    profiles: [monitoreo]
    restart: unless-stopped
    # Mira el HOST (la EC2), no su propio contenedor: por eso ve los procesos
    # del host y su disco montado en solo lectura.
    pid: host
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    networks: [cep]

  loki:
    image: grafana/loki:3.7.11
    container_name: cep-loki
    profiles: [monitoreo]
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./infra/monitoreo/loki.yml:/etc/loki/loki.yml:ro
      - loki-datos:/loki
    mem_limit: 256m
    networks: [cep]

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: cep-alloy
    profiles: [monitoreo]
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./infra/monitoreo/config.alloy:/etc/alloy/config.alloy:ro
      # Solo lectura: Alloy lee los logs de los contenedores, no los maneja.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    mem_limit: 192m
    networks: [cep]

  grafana:
    image: grafana/grafana:13.3.2
    container_name: cep-grafana
    profiles: [monitoreo]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Sin `:?` a propósito: Compose interpola el archivo ENTERO aunque el perfil
      # esté apagado, y un `:?` botaría el `up` normal y el CD. En la EC2 la
      # genera tools/desplegar.sh; en tu PC, vacía = admin/admin (solo 127.0.0.1).
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_CLAVE:-}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableros/cacha-el-precio.json
      # CloudWatch (Kinesis y SQS): en la EC2 usa el LabRole; en tu PC, estas.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./infra/monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoreo/grafana/tableros:/var/lib/grafana/tableros:ro
      - grafana-datos:/var/lib/grafana
    ports:
      # Solo 127.0.0.1: nunca abierto a internet (ni el security group lo abre).
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki]
    mem_limit: 512m
    networks: [cep]

# ─────────────────────────────────────────────────────────────────────────────
#  Volúmenes: donde Docker guarda los datos para que no se pierdan al apagar
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-datos:
  caddy_data:
  caddy_config:
  # Monitoreo (perfil `monitoreo`): 3 días de métricas y logs, y Grafana.
  prometheus-datos:
  loki-datos:
  grafana-datos:

# ─────────────────────────────────────────────────────────────────────────────
#  Red interna: los contenedores se ven entre ellos por su nombre de servicio.
#  Desde el BFF, la base de datos es el host `postgres`, no `localhost`.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  cep:
    driver: bridge
