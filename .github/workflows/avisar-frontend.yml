# Qué hace: cuando entra un commit a development o a main que toca frontend/,
# le avisa a Panditax727/Cacha-el-Precio-Frontend para que sincronice y
# despliegue. La copia, el build y el deploy los hace el workflow de ESE repo.
#
# Por qué también development (26-11): el repo del frontend copia desde
# development (MONO_BRANCH: development), así que avisar solo desde main dejaba
# cada merge esperando la copia programada «cada 15 min», que GitHub en la
# práctica corría cada varias horas. Hasta la EFT, lo que entra a development
# llega a www en 1–2 minutos. Cuando el repo del frontend pase a copiar desde
# main (MONO_BRANCH: main), se saca development de aquí: ver docs/CICD.md.
#
# Secret necesario en ESTE repo (Settings → Secrets and variables → Actions):
#   FRONTEND_REPO_TOKEN   token fino de Panditax727, solo para el repo del frontend

name: Avisar al repo del frontend

on:
  push:
    branches: [development, main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sincronización en el repo del frontend
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          gh api repos/Panditax727/Cacha-el-Precio-Frontend/dispatches \
            -f event_type=monorepo-frontend-changed \
            -f "client_payload[sha]=${GITHUB_SHA}"
