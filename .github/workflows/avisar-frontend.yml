# Qué hace: cuando entra un commit a main que toca frontend/, le avisa a
# Panditax727/Cacha-el-Precio-Frontend para que sincronice y despliegue. La
# copia, el build y el deploy los hace el workflow de ESE repo.
#
# Solo main (27-11, vuelve el diseño original del ADR-034): main es producción
# para el front y para el backend. Del 26 al 27-11 también avisaba desde
# development, porque main iba 300 commits atrás. Va de la mano con
# MONO_BRANCH: main en el repo del frontend: si una punta cambia sin la otra,
# el sitio deja de actualizarse o publica la rama equivocada (docs/CICD.md).
#
# Secret necesario en ESTE repo (Settings → Secrets and variables → Actions):
#   FRONTEND_REPO_TOKEN   token fino de Panditax727, solo para el repo del frontend

name: Avisar al repo del frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sincronización en el repo del frontend
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          gh api repos/Panditax727/Cacha-el-Precio-Frontend/dispatches \
            -f event_type=monorepo-frontend-changed \
            -f "client_payload[sha]=${GITHUB_SHA}"
