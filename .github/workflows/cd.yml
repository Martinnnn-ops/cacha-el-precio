# ---------------------------------------------------------------------------
# CD · "llévalo a producción" (backend + frontend)
#
# Corre al mergear a main. Si el CI falla, no corre nada más:
#
#   1. ci         el mismo ci.yml de los PR. Sin CI verde no se despliega.
#   ── backend ──
#   2. imagenes   arma las 4 imágenes en GitHub (no en la EC2, que tiene 2 GB)
#                 y las sube a GHCR con el hash del commit como etiqueta.
#   3. desplegar  ¿la EC2 está prendida? → SSH, baja las imágenes, levanta y
#                 revisa /health; si falla, vuelve a la versión anterior.
#                 Si está apagada (fuera de la sesión del lab), se salta SIN
#                 fallar: AWS apagado es lo normal, no una avería.
#   ── frontend ── (en paralelo, no depende de que AWS esté prendido)
#   4. frontend   compila con el Cognito y la API de la cuenta, revisa que el
#                 bundle los lleve y lo publica como Worker de Cloudflare.
#
# NO usa credenciales de AWS (las del Learner Lab vencen cada ~4 h): entra por
# SSH, igual que tools/desplegar.sh. Terraform sigue siendo manual (tf.sh).
#
# Environment "produccion":
#   secrets    EC2_HOST                IP elástica de la EC2
#              EC2_SSH_KEY             contenido de labsuser.pem
#              CLOUDFLARE_API_TOKEN    token "github-cd-workers" (solo Workers)
#   variables  CLOUDFLARE_ACCOUNT_ID   (no son secretas: igual viajan en el JS)
#              FRONT_API_URL           API_GATEWAY_URL_PROD de api-gateway.env
#              FRONT_COGNITO_CLIENT_ID VITE_COGNITO_CLIENT_ID de cognito.env
#              FRONT_COGNITO_DOMAIN    COGNITO_URL_LOGIN de cognito.env
# ---------------------------------------------------------------------------
name: CD

on:
  push:
    # ⚠️ TEMPORAL: feature/cicd solo para la prueba de hoy. Se saca antes del PR.
    branches: [main, feature/cicd]
  # Botón "Run workflow" (aparece cuando este archivo ya está en main).
  workflow_dispatch:

# Dos despliegues a la vez pisarían la misma máquina: el segundo espera.
concurrency:
  group: cd-produccion
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRO: ghcr.io/martinnnn-ops/cacha-el-precio

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  imagenes:
    name: Imagen ${{ matrix.nombre }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # subir a GHCR
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: gateway
            contexto: .
            dockerfile: gateway/Dockerfile
          - nombre: product-service
            contexto: .
            dockerfile: product-service/Dockerfile
          - nombre: notification-service
            contexto: .
            dockerfile: notification-service/Dockerfile
          - nombre: scraper
            contexto: scraper-service
            dockerfile: scraper-service/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiqueta = hash completo del commit: así se sabe exactamente qué corre
      # en la EC2. "latest" es solo una comodidad para mirar.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.nombre }}:${{ github.sha }}
            ${{ env.REGISTRO }}/${{ matrix.nombre }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Caché de capas en GitHub: si solo cambia el código, no reinstala todo.
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  desplegar:
    name: Desplegar en la EC2
    needs: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: https://api.cacha-el-precio.com/health
    permissions:
      contents: read
      packages: read           # el token que usa la EC2 para bajar de GHCR
    steps:
      - uses: actions/checkout@v5

      # ¿Hay a dónde desplegar? Sin secrets o con la EC2 apagada, se avisa y
      # se termina en verde: no es un error, es que el lab no está corriendo.
      - name: ¿AWS prendido?
        id: aws
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [[ -z "$EC2_HOST" || -z "$EC2_SSH_KEY" ]]; then
            echo "::warning::Faltan los secrets EC2_HOST / EC2_SSH_KEY: despliegue omitido."
            echo "prendido=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          install -m 600 /dev/null ~/llave.pem
          printf '%s\n' "$EC2_SSH_KEY" > ~/llave.pem
          if timeout 20 ssh -i ~/llave.pem -o StrictHostKeyChecking=accept-new \
               -o ConnectTimeout=10 -o BatchMode=yes "ec2-user@$EC2_HOST" true 2>/dev/null; then
            echo "prendido=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS apagado (la EC2 no responde por SSH): despliegue omitido."
            echo "prendido=false" >> "$GITHUB_OUTPUT"
          fi

      # Login a GHCR en la EC2, en una llamada aparte para que el token no viaje
      # dentro del script. El token de GitHub vence al terminar este job.
      - name: Login de la EC2 a GHCR
        if: steps.aws.outputs.prendido == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/llave.pem -o BatchMode=yes "ec2-user@$EC2_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin" >/dev/null
          echo "  login a GHCR hecho"

      - name: Desplegar ${{ github.sha }}
        if: steps.aws.outputs.prendido == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/llave.pem -o BatchMode=yes "ec2-user@$EC2_HOST" \
            "bash -s -- ${{ github.sha }}" < tools/cd-remoto.sh

      # Siempre: que no quede ni la llave en el runner ni el token en la EC2.
      - name: Limpiar
        if: always() && steps.aws.outputs.prendido == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/llave.pem -o BatchMode=yes "ec2-user@$EC2_HOST" "docker logout ghcr.io" >/dev/null || true
          rm -f ~/llave.pem

  frontend:
    name: Frontend en Cloudflare
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: produccion
      url: https://www.cacha-el-precio.com
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL: ${{ vars.FRONT_API_URL }}
      CLIENT_ID: ${{ vars.FRONT_COGNITO_CLIENT_ID }}
      DOMINIO: ${{ vars.FRONT_COGNITO_DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Hay a dónde publicar?
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$TOKEN" || -z "$CUENTA" ]]; then
            echo "::warning::Falta CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: frontend omitido."
            echo "listo=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Sin los datos de Cognito, el sitio compilaría "bien" y mandaría a la
          # gente a un login que no existe. Eso es un error, no un salto.
          for v in API_URL CLIENT_ID DOMINIO; do
            [[ -n "${!v}" ]] || { echo "::error::Falta la variable FRONT_${v} del environment"; exit 1; }
          done
          echo "listo=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.cf.outputs.listo == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Igual que el paso 4 de tools/desplegar.sh: el modo produccion.local
      # lleva los datos de ESTA cuenta. frontend/.env.production está vacío a
      # propósito, y no hay "respaldo" a un build sin ellos.
      - name: Compilar con el Cognito y la API de la cuenta
        if: steps.cf.outputs.listo == 'true'
        run: |
          npm ci
          cat > .env.produccion.local <<FRONT
          VITE_API_BASE_URL=$API_URL
          VITE_API_VERSION=1.0
          VITE_COGNITO_CLIENT_ID=$CLIENT_ID
          VITE_COGNITO_DOMAIN=$DOMINIO
          FRONT
          npm run build -- --mode produccion.local

      # Cinturón: mirar DENTRO del bundle antes de publicarlo. Si no lleva el
      # client id y la API de la cuenta, no se publica.
      - name: Revisar el bundle
        if: steps.cf.outputs.listo == 'true'
        run: |
          grep -rqF "$CLIENT_ID" dist/assets/*.js || { echo "::error::El bundle no lleva el client id $CLIENT_ID"; exit 1; }
          grep -rqF "$API_URL"   dist/assets/*.js || { echo "::error::El bundle no lleva la API $API_URL"; exit 1; }
          echo "  ✅ el bundle apunta a $API_URL y al client $CLIENT_ID"

      # wrangler va con versión fija (con 2 semanas de uso, no la del día) y no
      # queda en package.json: solo lo usa el CD.
      - name: Publicar el Worker
        if: steps.cf.outputs.listo == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.157.0 deploy
