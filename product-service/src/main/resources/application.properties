micronaut.application.name=product-service
micronaut.server.port=${PRODUCT_PORT:8081}
grpc.server.port=${PRODUCT_GRPC_PORT:50051}

datasources.default.url=${PRODUCT_DB_URL:`jdbc:sqlite:product.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL`}
datasources.default.dialect=SQLITE
datasources.default.driver-class-name=org.sqlite.JDBC
datasources.default.maximum-pool-size=1

flyway.datasources.default.enabled=true

endpoints.health.enabled=true
endpoints.health.sensitive=false

micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui

micronaut.router.versioning.enabled=true
micronaut.router.versioning.header.enabled=true
micronaut.router.versioning.header.names[0]=X-API-VERSION
micronaut.router.versioning.header.names[1]=X-VERSION
micronaut.router.versioning.parameter.enabled=false
