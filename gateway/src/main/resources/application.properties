micronaut.application.name=gateway
# El puerto sale del entorno para que el mismo build sirva en local y en la EC2.
micronaut.server.port=${GATEWAY_PORT:8080}

# /health responde sin autenticacion: lo consulta el healthcheck del contenedor,
# que no tiene token ni deberia tenerlo.
endpoints.health.enabled=true
endpoints.health.sensitive=false

# ─────────────────────────────────────────────────────────────────────────────
#  Seguridad · la validacion del token de Cognito (el 40% del EP1)
# ─────────────────────────────────────────────────────────────────────────────
#  Todo sale del entorno a proposito: si manana el equipo unifica los dos user
#  pools, cambia el .env y no se recompila nada. Los valores los emite
#  tools/crear-cognito.sh en cognito.env.

micronaut.security.authentication=bearer

# 1. LA FIRMA — se verifica contra las llaves publicas que Cognito publica en su
#    JWKS. Se descargan una vez y quedan cacheadas; no se piden en cada request.
micronaut.security.token.jwt.signatures.jwks.cognito.url=${COGNITO_JWKS_URI}

# 2. EL EMISOR — que el token venga de NUESTRO user pool y no de otro cualquiera.
micronaut.security.token.jwt.claims-validators.issuer=${COGNITO_ISSUER}

# 3. LA VIGENCIA — `exp` y `nbf`. Van activadas por defecto; se declaran igual
#    para que se vea que la decision fue explicita y no un descuido.
micronaut.security.token.jwt.claims-validators.expiration=true
micronaut.security.token.jwt.claims-validators.not-before=true

# 4. EL AUDIENCE — NO se configura aca, y es a proposito.
#    Cognito no manda `aud` en el access_token: manda `client_id`. Si se activara
#    la validacion estandar de audience, TODO token real daria 401. El equivalente
#    se valida en ValidadorDeClientId, que ademas acepta los dos clients nuestros
#    (el del frontend y el de pruebas). Detalle en ARQUITECTURA.md seccion 9.
cognito.client-ids-validos=${COGNITO_CLIENT_IDS_VALIDOS:}

# 5. LOS ROLES — Cognito los publica en `cognito:groups`, no en `roles`, que es
#    donde Micronaut los busca por defecto. Sin esta linea @Secured("admin")
#    nunca calza y el 403 de la demo no existe.
micronaut.security.token.roles-name=cognito:groups

# /health queda anonimo: lo consulta el healthcheck del contenedor, que no tiene
# token ni deberia tenerlo. Es la unica ruta abierta del servicio.
micronaut.security.intercept-url-map[0].pattern=/health
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()

# ─────────────────────────────────────────────────────────────────────────────
#  A quien consulta el BFF
# ─────────────────────────────────────────────────────────────────────────────
#  En tu computador product-service escucha en localhost:8081. Dentro del
#  compose, el host es el NOMBRE DEL SERVICIO, no localhost: cada contenedor
#  tiene su propio localhost y ahi no hay nadie escuchando.
servicios.product.url=${PRODUCT_URL:`http://localhost:8081`}
