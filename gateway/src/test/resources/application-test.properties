micronaut.server.port=-1

# Valores de mentira para que el contexto arranque sin depender de AWS.
# Ningun test de este paquete llega a verificar una firma: todos comprueban el
# rechazo, que ocurre ANTES de tocar el JWKS. El test contra Cognito de verdad
# usa el client `pruebas` y vive aparte, porque necesita credenciales.
micronaut.security.token.jwt.signatures.jwks.cognito.url=https://ejemplo.invalido/.well-known/jwks.json
micronaut.security.token.jwt.claims-validators.issuer=https://ejemplo.invalido/pool
cognito.client-ids-validos=clientdeprueba123
